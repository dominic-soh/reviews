services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: reviews
      POSTGRES_PASSWORD: reviews
      POSTGRES_DB: reviews
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviews -d reviews"]
      interval: 2s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
