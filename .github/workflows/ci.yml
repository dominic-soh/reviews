name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reviews
          POSTGRES_PASSWORD: reviews
          POSTGRES_DB: reviews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviews -d reviews"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://reviews:reviews@127.0.0.1:5432/reviews
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run ci
